{% extends "base.html" %}
{% block title %}Регистрация — Streak{% endblock %}

{% block content %}
<section class="card auth">
  <div class="auth-icon">🌱</div>
  <h1>Создай свой сад</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <form method="post" class="habit-form">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <input type="hidden" name="tz" value="" data-auto>
    <label class="field">Логин
      <input type="text" name="username" value="{{ username }}" required autofocus
             minlength="3" maxlength="30" autocomplete="username">
      <span class="hint">3–30 символов: латинские буквы, цифры, _ . -</span>
    </label>
    <label class="field">Пароль
      <input type="password" name="password" required minlength="8" maxlength="128" autocomplete="new-password">
      <span class="hint">Не короче 8 символов</span>
    </label>
    <label class="field">Повторите пароль
      <input type="password" name="password2" required minlength="8" maxlength="128" autocomplete="new-password">
    </label>
    <button class="btn" type="submit">Создать аккаунт</button>
  </form>

  <p class="muted small" style="text-align:center; margin-top:14px">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
</section>
{% endblock %}
